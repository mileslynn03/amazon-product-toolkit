name: Windows and macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    env:
      CI: "true"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Prepare and reuse environment on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call start_windows.bat --lang en --setup-only
          if errorlevel 1 exit /b 1
          call start_windows.bat --lang en --check
          if errorlevel 1 exit /b 1
          .venv\Scripts\python.exe -m pip install -r requirements-dev.txt
          if errorlevel 1 exit /b 1
          .venv\Scripts\python.exe -m unittest discover -s tests -v
      - name: Prepare and reuse environment on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash -n start_macos.command
          bash start_macos.command --lang en --setup-only
          bash start_macos.command --lang en --check
          .venv/bin/python -m pip install -r requirements-dev.txt
          .venv/bin/python -m unittest discover -s tests -v
